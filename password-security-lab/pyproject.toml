[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "password-security-lab"
version = "1.0.0"
description = "A privacy-focused Python application for password-strength assessment, secure password generation, and breached-password detection using Have I Been Pwned k-anonymity."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "requests>=2.32,<3.0",
    "zxcvbn>=4.4.28,<5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra -q"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests", "main.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "SIM", "RUF"]
ignore = [
    "E501",   # Line length is managed by formatter; long UI copy strings stay readable
    "S101",   # Allow assert in tests (configured per-file below too)
    "S105",   # False positives on non-credential string constants like "Common Password"
    "S106",
]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S107"]
